name: Backend tests and reproducible demo
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m examples.compare_prompts
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-prompt-comparison
          path: backend/data/demo-comparison.json
